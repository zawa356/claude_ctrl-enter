name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Key handling and the Linux installer only; the PowerShell installer and Edge-based UI tests run on Windows.
      - run: node tests/keyboard.test.cjs
      - run: node tests/installer-sh.test.cjs
      - run: bash -n scripts/claude-keys.sh

  release:
    needs: [test, test-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build release ZIP
        shell: powershell
        run: |
          $version = (Get-Content extension\manifest.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match manifest version $version" }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-release.ps1
      - name: Extract release notes from CHANGELOG
        shell: powershell
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (!$m.Success) { throw "No CHANGELOG section for $version" }
          [IO.File]::WriteAllText("$PWD\dist\NOTES.md", $m.Groups[1].Value.Trim(), (New-Object Text.UTF8Encoding($false)))
      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist\*.zip).FullName dist\SHA256SUMS.txt --title "${{ github.ref_name }}" --notes-file dist\NOTES.md
